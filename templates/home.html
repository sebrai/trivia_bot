<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>home</title>
    <link rel="stylesheet" href="{{url_for('static',filename = 'style.css')}}">
</head>

<body>
    <header>
       <div>
        <h1>{{session['username']}}</h1>
        <h2>score: {{session['score']}}</h2>
    </div> 
        <div></div>
        <img src="https://ui-avatars.com/api/?&color=000&name={{ session.get('username') }}"
            alt="{{session['username']}} ">
    </header>
    <main>
        <div class="questions">
        <a href="{{url_for('answer',diffi = 'easy')}}"><button class="qb" style="background-color: #b8e9b8;">easy</button></a>
        <a href="{{url_for('answer',diffi = 'medium')}}"><button class="qb" style="background-color: #e9e8b8;">medium</button></a>
        <a href="{{url_for('answer',diffi = 'hard')}}"><button class="qb" style="background-color: #e9b8b8;">hard</button></a>
        </div>
        <a href="{{url_for('info')}}" class="info_b"><button>(?)</button></a>
    </main>
    <footer>
        <a href="{{url_for('logout')}}"><button>logout</button></a>
        <div class="flashes">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}" id="m">
                            {{ message }}  
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
        </div>
    </footer>
</body>
<script src="https://cdn.jsdelivr.net/npm/@hiseb/confetti@2.2.0/dist/confetti.min.js"></script>
<script src="{{url_for('static',filename = 'reaction.js')}}"></script>

</html>
